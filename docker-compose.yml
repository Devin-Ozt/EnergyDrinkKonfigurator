services:
  webserver:
    image: php:8.4-apache
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
    command: bash -c "docker-php-ext-install mysqli pdo pdo_mysql && apache2-foreground"
  
  db:
    image: mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpasswort
      MYSQL_DATABASE: meine_db
      MYSQL_USER: benutzer
      MYSQL_PASSWORD: benutzerpasswort
    volumes:
      - db_data:/var/lib/mysql
  
  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpasswort

volumes:
  db_data:
